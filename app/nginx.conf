server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Same-origin /api/* proxy to the NestJS server service, so the built
  # frontend can call fetch('/api/...') exactly like it does in dev.
  location /api/ {
    proxy_pass http://server:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build output never changes under its name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # Crawler files must be real files, never the SPA shell.
  location = /robots.txt { try_files $uri =404; }
  location = /sitemap.xml { try_files $uri =404; }

  # Private and token routes: the shell is served, but never indexed.
  location ~ ^/(admin|dashboard|account|children|notifications|my-teams|results|clubs|invite|guardian-invite|r|verify-email|reset-password|login|forgot-password)(/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri /index.html;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
