<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the fixed bottom tab bar is
         positioned against the layout viewport, which on-screen keyboards
         used to leave untouched (the visual viewport shrank instead),
         making the bar appear to float mid-screen or drift off-bottom
         while a form field was focused. This tells supporting browsers to
         resize the layout viewport itself when the keyboard opens, so
         "bottom: 0" keeps meaning the actual visible bottom. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Kluvo — La gestion d'équipe, simplifiée.</title>
    <meta
      name="description"
      content="Kluvo centralise calendriers, convocations et présences pour les clubs de basket amateurs."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kluvo.net/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kluvo" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://kluvo.net/" />
    <meta property="og:title" content="Kluvo — La gestion d'équipe, simplifiée." />
    <meta
      property="og:description"
      content="Kluvo centralise calendriers, convocations et présences pour les clubs de basket amateurs."
    />
    <meta property="og:image" content="https://kluvo.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Kluvo, la gestion d'équipe pour les clubs de basket amateurs"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kluvo — La gestion d'équipe, simplifiée." />
    <meta
      name="twitter:description"
      content="Kluvo centralise calendriers, convocations et présences pour les clubs de basket amateurs."
    />
    <meta name="twitter:image" content="https://kluvo.net/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://kluvo.net/#organization",
            "name": "Kluvo",
            "url": "https://kluvo.net/",
            "logo": "https://kluvo.net/icon-512.png",
            "email": "contact@kluvo.net"
          },
          {
            "@type": "WebSite",
            "@id": "https://kluvo.net/#website",
            "url": "https://kluvo.net/",
            "name": "Kluvo",
            "inLanguage": "fr-FR",
            "publisher": { "@id": "https://kluvo.net/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Kluvo",
            "url": "https://kluvo.net/",
            "applicationCategory": "SportsApplication",
            "operatingSystem": "Web",
            "inLanguage": "fr-FR",
            "description": "Calendriers, convocations, présences et statistiques pour les clubs de basket amateurs.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
            "publisher": { "@id": "https://kluvo.net/#organization" }
          }
        ]
      }
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#D4622A" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- iOS "add to home screen" only reads these meta tags, not the manifest -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kluvo" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- The prerendered markup belongs to the public routes only. The same file
         is also the SPA fallback for every other path, where it would flash
         the landing page before the app mounts. -->
    <script>
      if (!__PRERENDERED_PATHS__.includes(location.pathname.replace(/(.)\/+$/, '$1'))) {
        document.getElementById('root').textContent = '';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
