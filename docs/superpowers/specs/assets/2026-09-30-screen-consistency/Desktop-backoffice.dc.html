            box-shadow:

              0 1px 2px rgba(59, 42, 24, 0.05);

            padding: 12px;

            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 14px;
            line-height: 20px;
            border: 1px solid transparent;
            box-sizing: border-box;

            height: 44px;
            padding: 0 16px;

            height: 36px;
            padding: 0 12px;

            height: 44px;
            width: 44px;
            padding: 0;

            background: #aa4f22;
            color: #faf5ef;
            box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
          }
          .btn-outline {
            border-color: #d6c8b2;
            background: #faf5ef;
            color: #23201c;
          }
          .btn-ghost {
            background: transparent;
            color: #23201c;
          }

          .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border-radius: 999px;
            font-size: 12px;
            line-height: 16px;
            padding: 2px 10px;
            font-weight: 600;
            border: 1px solid transparent;

          .badge-soft-structure {
            border-color: rgba(30, 95, 116, 0.25);
            background: #eaf1f3;
            color: #1e5f74;
          }
          .badge-soft-accent {
            border-color: rgba(192, 138, 46, 0.35);
            background: #fbf1dc;
            color: #8c5f16;
          }
          .badge-soft-muted {
            border-color: #e7decf;
            background: #faf5ef;
            color: #5b564f;
          }
          .badge-outline-neutral {
            border-color: #e7decf;
            color: #23201c;
          }
          /* IconBadge */
          .icon-badge {
            display: inline-flex;
            height: 40px;
            width: 40px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: #eaf1f3;
            color: #1e5f74;
          }
          .icon-badge-accent {
            background: #fbf1dc;
            color: #8c5f16;
          }

          .rail {
            width: 2px;
            flex: 1;
            background: rgba(30, 95, 116, 0.25);
            margin: 4px 0;
          }
          .hairline {
            height: 1px;
            background: #e7decf;
          }
          /* Label + Input */
          .label {
            font-size: 14px;
            line-height: 20px;
            font-weight: 500;
            color: #23201c;
          }
          .input {
            display: flex;
            height: 44px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 10px;
            border: 1px solid #d6c8b2;
            background: #faf5ef;
            padding: 8px 12px;
            font: inherit;
            font-size: 16px;
            color: #23201c;
          }
          /* Dialog */
          .overlay {
            position: absolute;
            inset: 0;
            background: rgba(35, 32, 28, 0.5);
          }
          .sheet {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            box-sizing: border-box;
            background: #fffcf7;
            border-top: 1px solid #e7decf;
            border-radius: 20px 20px 0 0;
            padding: 24px;
            box-shadow:
              0 10px 28px rgba(59, 42, 24, 0.11),
              0 2px 6px rgba(59, 42, 24, 0.06);
          }
          .sheet-handle {
            position: absolute;
            top: 8px;
            left: 50%;
            margin-left: -20px;
            width: 40px;
            height: 4px;
            border-radius: 999px;
            background: #d6c8b2;
          }
          .dialog-close {
            position: absolute;
            right: 8px;
            top: 8px;
            display: flex;
            height: 44px;
            width: 44px;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: rgba(35, 32, 28, 0.6);
            background: transparent;
            border: 0;
          }
          .dialog-title {
            font-family: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
            font-size: 30px;
            line-height: 36px;
            font-weight: 800;
            text-transform: uppercase;
            color: #23201c;
            margin: 0;
          }
          .dialog-desc {
            font-size: 14px;
            line-height: 20px;
            color: #5b564f;
            margin: 0;
          }
          /* Toast success */
          .toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            border-radius: 14px;
            border: 1px solid #2f7d5c;
            background: #eaefe8;
            color: #245f48;
            padding: 16px;
            box-shadow:

            gap: 8px;

            font-size: 24px;
            line-height: 32px;
            font-weight: 800;
            text-transform: uppercase;
            color: #aa4f22;
          }
          .tabbar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            border-top: 1px solid #e7decf;
            background: #fffcf7;
          }
          .tab {

            min-height: 44px;

            align-items: center;
            justify-content: center;
            gap: 4px;
