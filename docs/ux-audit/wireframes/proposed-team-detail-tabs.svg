<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="1000" height="900" fill="#FAF5EF"/>
  <rect x="0" y="0" width="1000" height="64" fill="#FFFFFF" stroke="#E4DACD"/>
  <text x="24" y="40" font-size="22" font-weight="800" fill="#D4622A" font-family="Georgia, serif">BasketEasy</text>

  <text x="24" y="100" font-size="13" fill="#1E5F74">&#8592; Mes équipes</text>
  <text x="24" y="140" font-size="28" font-weight="700" fill="#23201C" font-family="Georgia, serif">U15 Filles</text>
  <g>
    <rect x="230" y="120" width="150" height="24" rx="12" fill="#FBEEE6"/>
    <text x="244" y="137" font-size="11" fill="#B23B3B">CTC · 2 clubs</text>
  </g>
  <text x="24" y="164" font-size="13" fill="#6B645A">AS Basket Nantes (propriétaire) · ES Rezé</text>
  <rect x="880" y="118" width="96" height="32" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
  <text x="898" y="139" font-size="12" fill="#23201C">Modifier</text>

  <!-- tab bar -->
  <g>
    <line x1="24" y1="200" x2="976" y2="200" stroke="#E4DACD"/>
    <text x="30" y="196" font-size="14" font-weight="700" fill="#D4622A">Effectif</text>
    <rect x="24" y="200" width="90" height="3" fill="#D4622A"/>
    <text x="150" y="196" font-size="14" fill="#6B645A">Calendrier</text>
    <text x="290" y="196" font-size="14" fill="#6B645A">Clubs partenaires</text>
    <text x="450" y="196" font-size="14" fill="#6B645A">Administrateurs</text>
  </g>

  <!-- roster: card grid instead of a bare table -->
  <g>
    <rect x="24" y="228" width="500" height="32" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="36" y="248" font-size="11" fill="#8A8377">Rechercher un joueur...</text>
    <rect x="820" y="228" width="156" height="32" rx="6" fill="#D4622A"/>
    <text x="850" y="249" font-size="12" fill="#FFFFFF">+ Ajouter</text>

    <!-- roster grouped by role, avatar + name cards -->
    <text x="24" y="298" font-size="12" font-weight="700" fill="#6B645A">JOUEUSES (13)</text>
    <g font-size="12" fill="#23201C">
      <!-- row of player chips -->
      <g><circle cx="46" cy="330" r="18" fill="#1E5F74"/><text x="38" y="335" fill="#FFF" font-size="11">LM</text><text x="72" y="335">Léa Martin</text></g>
      <g><circle cx="246" cy="330" r="18" fill="#1E5F74"/><text x="236" y="335" fill="#FFF" font-size="11">CD</text><text x="272" y="335">Chloé Dubois</text></g>
      <g><circle cx="446" cy="330" r="18" fill="#1E5F74"/><text x="436" y="335" fill="#FFF" font-size="11">SF</text><text x="472" y="335">Sarah Fabre</text></g>
      <g><circle cx="646" cy="330" r="18" fill="#1E5F74"/><text x="636" y="335" fill="#FFF" font-size="11">NP</text><text x="672" y="335">Nina Perrin</text></g>
      <g><circle cx="846" cy="330" r="18" fill="#1E5F74"/><text x="838" y="335" fill="#FFF" font-size="11">+9</text></g>
    </g>
    <text x="24" y="380" font-size="12" font-weight="700" fill="#6B645A">STAFF (2)</text>
    <g font-size="12" fill="#23201C">
      <g><circle cx="46" cy="412" r="18" fill="#D4622A"/><text x="38" y="417" fill="#FFF" font-size="11">IP</text><text x="72" y="417">Inès Petit — Coach</text></g>
      <g><circle cx="246" cy="412" r="18" fill="#D4622A"/><text x="238" y="417" fill="#FFF" font-size="11">ML</text><text x="272" y="417">Marc Lefevre — Admin d'équipe</text></g>
    </g>
    <line x1="24" y1="450" x2="976" y2="450" stroke="#F1E9DD"/>
    <text x="24" y="480" font-size="12" fill="#1E5F74">Basculer en vue tableau (tri, export) &#8594;</text>
  </g>

  <!-- annotation -->
  <g>
    <rect x="24" y="540" width="952" height="320" rx="6" fill="#EAF1EE" stroke="#1E5F74" stroke-dasharray="4 3"/>
    <text x="40" y="568" font-size="13" font-weight="700" fill="#1E5F74">What changed vs. today's TeamDetailPage</text>
    <text x="40" y="592" font-size="12" fill="#23201C">Today: 4 table sections (Clubs partenaires, Effectif, Événements, Administrateurs) are all stacked on one</text>
    <text x="40" y="612" font-size="12" fill="#23201C">page, each with its own search/sort/pagination — reaching "Administrateurs" needs scrolling past three other</text>
    <text x="40" y="632" font-size="12" fill="#23201C">tables, and the Admins table alone has no search or pagination, breaking the pattern.</text>
    <text x="40" y="662" font-size="12" fill="#23201C">Proposed: a Tabs shell (already exists in @basketeasy/ui, used on MembersPage) — Effectif / Calendrier /</text>
    <text x="40" y="682" font-size="12" fill="#23201C">Clubs partenaires / Administrateurs each get their own tab instead of a shared scroll. Effectif defaults to a</text>
    <text x="40" y="702" font-size="12" fill="#23201C">grouped avatar-chip view (role-first, scannable at a glance for "who's on this team") with a one-click switch</text>
    <text x="40" y="722" font-size="12" fill="#23201C">back to the existing sortable table for admins who need to export or bulk-edit — so the current Table/</text>
    <text x="40" y="742" font-size="12" fill="#23201C">Pagination work isn't thrown away, it becomes the "power view" behind a toggle rather than the only view.</text>
    <text x="40" y="772" font-size="12" fill="#23201C">Calendrier tab: see proposed-events-calendar.svg — replaces the flat Événements table with a real calendar/</text>
    <text x="40" y="792" font-size="12" fill="#23201C">agenda so "what's happening this week" doesn't require reading a Date column across paginated rows.</text>
    <text x="40" y="822" font-size="12" fill="#23201C">Effort: mostly composition — Tabs, Table, Card, Avatar all already exist in @basketeasy/ui. No new design-</text>
    <text x="40" y="842" font-size="12" fill="#23201C">system primitives required beyond an Avatar-initials helper if one doesn't already exist.</text>
  </g>
</svg>
