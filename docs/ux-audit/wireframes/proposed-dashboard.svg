<svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="1000" height="900" fill="#FAF5EF"/>
  <rect x="0" y="0" width="1000" height="64" fill="#FFFFFF" stroke="#E4DACD"/>
  <text x="24" y="40" font-size="22" font-weight="800" fill="#D4622A" font-family="Georgia, serif">BasketEasy</text>
  <rect x="600" y="18" width="180" height="28" rx="14" fill="#F1E9DD" stroke="#E4DACD"/>
  <text x="618" y="36" font-size="12" fill="#23201C">AS Basket Nantes ▾</text>
  <text x="810" y="38" font-size="13" fill="#23201C">Mes équipes</text>
  <circle cx="960" cy="32" r="16" fill="#1E5F74"/>
  <text x="954" y="37" font-size="12" fill="#FFFFFF">JC</text>

  <text x="24" y="112" font-size="26" font-weight="700" fill="#23201C" font-family="Georgia, serif">Bonjour Johan 👋</text>
  <text x="24" y="136" font-size="13" fill="#6B645A">Voici ce qui se passe cette semaine dans vos clubs et équipes.</text>

  <!-- stat tiles -->
  <g>
    <rect x="24" y="160" width="222" height="90" rx="8" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="40" y="188" font-size="12" fill="#6B645A">Équipes gérées</text>
    <text x="40" y="228" font-size="30" font-weight="700" fill="#D4622A" font-family="Georgia, serif">4</text>

    <rect x="260" y="160" width="222" height="90" rx="8" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="276" y="188" font-size="12" fill="#6B645A">Événements — 7 prochains jours</text>
    <text x="276" y="228" font-size="30" font-weight="700" fill="#1E5F74" font-family="Georgia, serif">6</text>

    <rect x="496" y="160" width="222" height="90" rx="8" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="512" y="188" font-size="12" fill="#6B645A">Joueurs au total</text>
    <text x="512" y="228" font-size="30" font-weight="700" fill="#23201C" font-family="Georgia, serif">58</text>

    <rect x="732" y="160" width="244" height="90" rx="8" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="748" y="188" font-size="12" fill="#6B645A">Clubs administrés</text>
    <text x="748" y="228" font-size="30" font-weight="700" fill="#23201C" font-family="Georgia, serif">2</text>
  </g>

  <!-- upcoming events agenda strip -->
  <g>
    <text x="24" y="290" font-size="16" font-weight="700" fill="#23201C">Cette semaine</text>
    <text x="900" y="290" font-size="12" fill="#1E5F74">Voir le calendrier &#8594;</text>
    <rect x="24" y="304" width="952" height="150" rx="8" fill="#FFFFFF" stroke="#E4DACD"/>
    <g>
      <rect x="40" y="320" width="70" height="60" rx="6" fill="#F1E9DD"/>
      <text x="58" y="342" font-size="11" fill="#6B645A">JEU</text>
      <text x="58" y="366" font-size="20" font-weight="700" fill="#23201C">14</text>
      <text x="122" y="340" font-size="13" font-weight="600" fill="#23201C">U15 Filles — Entraînement</text>
      <text x="122" y="358" font-size="12" fill="#6B645A">18:00 · Gymnase Bonnet</text>
      <rect x="900" y="325" width="60" height="24" rx="12" fill="#E7F0EC"/>
      <text x="912" y="341" font-size="10" fill="#1E5F74">Confirmé</text>
    </g>
    <line x1="40" y1="392" x2="960" y2="392" stroke="#F1E9DD"/>
    <g>
      <rect x="40" y="400" width="70" height="60" rx="6" fill="#F1E9DD"/>
      <text x="55" y="422" font-size="11" fill="#6B645A">SAM</text>
      <text x="58" y="446" font-size="20" font-weight="700" fill="#23201C">16</text>
      <text x="122" y="420" font-size="13" font-weight="600" fill="#23201C">U18 Garçons — Match vs. Rezé</text>
      <text x="122" y="438" font-size="12" fill="#6B645A">10:00 · Salle Rezé Océane</text>
      <rect x="890" y="405" width="70" height="24" rx="12" fill="#FBEEE6"/>
      <text x="900" y="421" font-size="10" fill="#B23B3B">3 en attente</text>
    </g>
  </g>

  <!-- team cards instead of unbounded header buttons -->
  <g>
    <text x="24" y="500" font-size="16" font-weight="700" fill="#23201C">Vos équipes</text>
    <g>
      <rect x="24" y="514" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#E4DACD"/>
      <rect x="24" y="514" width="6" height="120" fill="#D4622A"/>
      <text x="44" y="544" font-size="15" font-weight="700" fill="#23201C">U15 Filles</text>
      <text x="44" y="564" font-size="12" fill="#6B645A">AS Basket Nantes + ES Rezé (CTC)</text>
      <text x="44" y="586" font-size="12" fill="#6B645A">15 joueuses · 2 admins</text>
      <text x="44" y="614" font-size="12" fill="#1E5F74">Prochain: Jeu. 14 août, 18:00</text>
    </g>
    <g>
      <rect x="340" y="514" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#E4DACD"/>
      <rect x="340" y="514" width="6" height="120" fill="#1E5F74"/>
      <text x="360" y="544" font-size="15" font-weight="700" fill="#23201C">U18 Garçons</text>
      <text x="360" y="564" font-size="12" fill="#6B645A">AS Basket Nantes</text>
      <text x="360" y="586" font-size="12" fill="#6B645A">18 joueurs · 1 admin</text>
      <text x="360" y="614" font-size="12" fill="#1E5F74">Prochain: Sam. 16 août, 10:00</text>
    </g>
    <g>
      <rect x="656" y="514" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#E4DACD" stroke-dasharray="4 3"/>
      <text x="676" y="580" font-size="13" fill="#8A8377">+ Voir toutes les équipes (4)</text>
    </g>
  </g>

  <!-- annotation -->
  <g>
    <rect x="24" y="670" width="952" height="180" rx="6" fill="#EAF1EE" stroke="#1E5F74" stroke-dasharray="4 3"/>
    <text x="40" y="698" font-size="13" font-weight="700" fill="#1E5F74">What changed vs. today's Dashboard</text>
    <text x="40" y="722" font-size="12" fill="#23201C">Today: DashboardPage is just a heading, the user's email, a logout button, and a dev "HealthStatus" widget.</text>
    <text x="40" y="744" font-size="12" fill="#23201C">Proposed: an actual landing surface — stat tiles, a "this week" agenda pulled from all of the user's teams'</text>
    <text x="40" y="764" font-size="12" fill="#23201C">events, and team cards replacing the header's unbounded per-club "Effectif" button list. Cards use existing</text>
    <text x="40" y="784" font-size="12" fill="#23201C">Card/Badge components from @basketeasy/ui — no new primitives needed, just a new composition + an</text>
    <text x="40" y="804" font-size="12" fill="#23201C">endpoint aggregating "my upcoming events" (backed by the existing GET /me/teams + per-team events data).</text>
    <text x="40" y="826" font-size="12" fill="#23201C">Move HealthStatus behind a dev-only flag or an /about page — it has no value for end users.</text>
  </g>
</svg>
