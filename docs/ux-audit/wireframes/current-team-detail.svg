<svg viewBox="0 0 1000 1400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="1000" height="1400" fill="#FAF5EF"/>
  <!-- header -->
  <rect x="0" y="0" width="1000" height="64" fill="#FAF5EF" stroke="#E4DACD"/>
  <text x="24" y="40" font-size="22" font-weight="800" fill="#D4622A" font-family="Georgia, serif">BasketEasy</text>
  <text x="700" y="38" font-size="13" fill="#23201C">Tableau de bord</text>
  <text x="810" y="38" font-size="13" fill="#23201C">Mes équipes</text>
  <text x="905" y="38" font-size="13" fill="#23201C">Mon profil</text>

  <text x="24" y="100" font-size="13" fill="#1E5F74">&#8592; Retour à l'effectif</text>
  <text x="24" y="140" font-size="28" font-weight="700" fill="#23201C" font-family="Georgia, serif">U15 Filles</text>
  <text x="24" y="164" font-size="13" fill="#6B645A">Club porteur: AS Basket Nantes · Partenaire: ES Rezé</text>

  <!-- section 1: partner clubs -->
  <g>
    <text x="24" y="210" font-size="16" font-weight="700" fill="#23201C">Clubs partenaires (CTC)</text>
    <rect x="24" y="222" width="952" height="120" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <rect x="24" y="222" width="952" height="30" fill="#F1E9DD"/>
    <text x="40" y="242" font-size="11" fill="#6B645A">CLUB</text>
    <text x="500" y="242" font-size="11" fill="#6B645A">RÔLE</text>
    <text x="850" y="242" font-size="11" fill="#6B645A">ACTION</text>
    <text x="40" y="278" font-size="13" fill="#23201C">AS Basket Nantes</text>
    <text x="500" y="278" font-size="13" fill="#23201C">Propriétaire</text>
    <text x="40" y="310" font-size="13" fill="#23201C">ES Rezé</text>
    <text x="500" y="310" font-size="13" fill="#23201C">Partenaire</text>
    <text x="850" y="310" font-size="12" fill="#B23B3B">Retirer</text>
  </g>

  <!-- section 2: roster -->
  <g>
    <text x="24" y="390" font-size="16" font-weight="700" fill="#23201C">Effectif</text>
    <rect x="24" y="400" width="600" height="32" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="36" y="420" font-size="11" fill="#8A8377">Rechercher un joueur...</text>
    <rect x="640" y="400" width="150" height="32" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="650" y="420" font-size="11" fill="#8A8377">Rôle ▾</text>
    <rect x="800" y="400" width="176" height="32" rx="6" fill="#D4622A"/>
    <text x="838" y="421" font-size="12" fill="#FFFFFF">+ Ajouter joueur</text>

    <rect x="24" y="444" width="952" height="230" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <rect x="24" y="444" width="952" height="30" fill="#F1E9DD"/>
    <text x="40" y="464" font-size="11" fill="#6B645A">JOUEUR</text>
    <text x="400" y="464" font-size="11" fill="#6B645A">CLUB</text>
    <text x="650" y="464" font-size="11" fill="#6B645A">RÔLE</text>
    <text x="880" y="464" font-size="11" fill="#6B645A">ACTION</text>
    <g fill="#23201C" font-size="13">
      <text x="40" y="500">Léa Martin</text><text x="400" y="500">AS Basket Nantes</text><text x="650" y="500">Joueuse</text>
      <text x="40" y="534">Chloé Dubois</text><text x="400" y="534">ES Rezé</text><text x="650" y="534">Joueuse</text>
      <text x="40" y="568">Inès Petit</text><text x="400" y="568">AS Basket Nantes</text><text x="650" y="568">Coach</text>
      <text x="40" y="602">... (12 more rows, scroll)</text>
    </g>
    <text x="440" y="660" font-size="11" fill="#8A8377">1–10 sur 15   ‹ 1 2 ›</text>
  </g>

  <!-- section 3: events -->
  <g>
    <text x="24" y="730" font-size="16" font-weight="700" fill="#23201C">Événements</text>
    <rect x="24" y="740" width="200" height="32" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="34" y="760" font-size="11" fill="#8A8377">Rechercher...</text>
    <rect x="234" y="740" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="244" y="760" font-size="11" fill="#8A8377">Du: __/__/__</text>
    <rect x="374" y="740" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <text x="384" y="760" font-size="11" fill="#8A8377">Au: __/__/__</text>
    <rect x="800" y="740" width="176" height="32" rx="6" fill="#D4622A"/>
    <text x="850" y="761" font-size="12" fill="#FFFFFF">+ Ajouter événement</text>

    <rect x="24" y="784" width="952" height="230" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <rect x="24" y="784" width="952" height="30" fill="#F1E9DD"/>
    <text x="40" y="804" font-size="11" fill="#6B645A">DATE</text>
    <text x="260" y="804" font-size="11" fill="#6B645A">LIEU</text>
    <text x="600" y="804" font-size="11" fill="#6B645A">NOTES</text>
    <text x="880" y="804" font-size="11" fill="#6B645A">ACTION</text>
    <g fill="#23201C" font-size="13">
      <text x="40" y="840">15/08/2026 18:00</text><text x="260" y="840">Gymnase Bonnet</text><text x="600" y="840">Entraînement</text>
      <text x="40" y="874">18/08/2026 10:00</text><text x="260" y="874">Salle Rezé Océane</text><text x="600" y="874">Match vs. Rezé</text>
      <text x="40" y="908">... (list continues as rows, no calendar view)</text>
    </g>
    <text x="440" y="1000" font-size="11" fill="#8A8377">1–10 sur 22   ‹ 1 2 3 ›</text>
  </g>

  <!-- section 4: admins, no pagination/filter (inconsistent) -->
  <g>
    <text x="24" y="1070" font-size="16" font-weight="700" fill="#23201C">Administrateurs de l'équipe</text>
    <rect x="24" y="1080" width="952" height="130" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
    <rect x="24" y="1080" width="952" height="30" fill="#F1E9DD"/>
    <text x="40" y="1100" font-size="11" fill="#6B645A">NOM</text>
    <text x="500" y="1100" font-size="11" fill="#6B645A">EMAIL</text>
    <text x="850" y="1100" font-size="11" fill="#6B645A">ACTION</text>
    <text x="40" y="1136" font-size="13" fill="#23201C">Marc Lefevre</text>
    <text x="500" y="1136" font-size="13" fill="#23201C">marc@asbn.fr</text>
  </g>

  <!-- annotations -->
  <g font-family="Inter, Arial, sans-serif">
    <rect x="24" y="1250" width="952" height="130" rx="6" fill="#FBEEE6" stroke="#D4622A" stroke-dasharray="4 3"/>
    <text x="40" y="1278" font-size="13" font-weight="700" fill="#B23B3B">Problems with this layout</text>
    <text x="40" y="1300" font-size="12" fill="#23201C">1. Four stacked table sections force heavy vertical scrolling to reach "Administrateurs".</text>
    <text x="40" y="1320" font-size="12" fill="#23201C">2. Events are a table, not a calendar — no sense of "what's this week" at a glance.</text>
    <text x="40" y="1340" font-size="12" fill="#23201C">3. Admins section has no search/pagination, inconsistent with the other three.</text>
    <text x="40" y="1360" font-size="12" fill="#23201C">4. No empty-state copy anywhere — an empty roster just shows blank rows.</text>
  </g>
</svg>
