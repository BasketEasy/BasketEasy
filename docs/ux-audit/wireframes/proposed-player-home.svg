<svg viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg" font-family="'Atkinson Hyperlegible', Inter, Arial, sans-serif">
  <rect width="1000" height="820" fill="#EFE4D4"/>

  <text x="24" y="40" font-size="24" font-weight="800" fill="#23201C" font-family="'Big Shoulders Display', 'Arial Narrow', sans-serif">STRUCTURE DE « MA SEMAINE »</text>
  <text x="24" y="62" font-size="12.5" fill="#5B564F">Ce que chaque bloc répond, dans quel ordre, et d’où vient sa donnée. Rendu haute fidélité : docs/ux-audit/mockups/player-home.html</text>

  <!-- phone column -->
  <rect x="24" y="86" width="300" height="620" rx="18" fill="#FFFCF7" stroke="#D6C8B2"/>
  <rect x="24" y="86" width="300" height="52" rx="18" fill="#FFFCF7" stroke="#E7DECF"/>
  <text x="44" y="118" font-size="17" font-weight="800" fill="#AA4F22" font-family="'Big Shoulders Display', 'Arial Narrow', sans-serif">Kluvo</text>
  <text x="44" y="132" font-size="9.5" fill="#5B564F">Seniors Filles 1 · AS Saint-Herblain</text>
  <circle cx="298" cy="112" r="14" fill="#1E5F74"/>
  <text x="291" y="116" font-size="9" fill="#FAF5EF">LM</text>

  <!-- greeting -->
  <text x="44" y="168" font-size="19" font-weight="800" fill="#23201C" font-family="'Big Shoulders Display', 'Arial Narrow', sans-serif">Bonjour Léa</text>
  <text x="44" y="186" font-size="10" fill="#5B564F">Mercredi 2 septembre · 2 réponses attendues</text>

  <!-- block 1 -->
  <text x="44" y="212" font-size="10.5" font-weight="700" fill="#5B564F">PROCHAIN RENDEZ-VOUS</text>
  <line x1="180" y1="208" x2="304" y2="208" stroke="#1E5F74" stroke-width="2" opacity="0.2"/>
  <rect x="44" y="220" width="260" height="86" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
  <rect x="44" y="220" width="48" height="86" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
  <text x="52" y="258" font-size="14" font-weight="800" fill="#23201C" font-family="'Big Shoulders Display', 'Arial Narrow', sans-serif">19:30</text>
  <text x="52" y="272" font-size="7.5" fill="#5B564F">ENTRAÎN.</text>
  <text x="102" y="240" font-size="10" font-weight="700" fill="#23201C">Gymnase du Vigneau</text>
  <text x="102" y="256" font-size="9" fill="#5B564F">Itinéraire · chasubles : vous</text>
  <text x="102" y="272" font-size="9" fill="#5B564F">Qui vient : 9 oui · 2 peut-être</text>
  <rect x="102" y="280" width="180" height="6" rx="3" fill="#E9DDCA"/>
  <rect x="102" y="280" width="115" height="6" rx="3" fill="#2F7D5C"/>

  <!-- block 2 -->
  <text x="44" y="332" font-size="10.5" font-weight="700" fill="#5B564F">À RÉPONDRE (2)</text>
  <line x1="140" y1="328" x2="304" y2="328" stroke="#1E5F74" stroke-width="2" opacity="0.2"/>
  <rect x="44" y="340" width="260" height="76" rx="6" fill="#FAF5EF" stroke="#D4622A" stroke-opacity="0.4"/>
  <rect x="44" y="340" width="48" height="52" fill="#1E5F74"/>
  <text x="50" y="368" font-size="13" font-weight="800" fill="#FAF5EF" font-family="'Big Shoulders Display', 'Arial Narrow', sans-serif">20:30</text>
  <text x="54" y="380" font-size="7" fill="#FAF5EF">MATCH</text>
  <rect x="100" y="348" width="66" height="14" rx="7" fill="#AA4F22"/>
  <text x="106" y="358" font-size="8" fill="#FAF5EF">Convoquée</text>
  <text x="100" y="378" font-size="10" font-weight="700" fill="#23201C">Sam. 5 · vs ESB Rezé</text>
  <rect x="52" y="396" width="244" height="14" rx="4" fill="#FFFCF7" stroke="#E7DECF"/>
  <text x="82" y="406" font-size="8" fill="#5B564F">Oui</text>
  <text x="160" y="406" font-size="8" fill="#5B564F">Peut-être</text>
  <text x="252" y="406" font-size="8" fill="#5B564F">Non</text>

  <rect x="44" y="424" width="260" height="46" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
  <text x="102" y="442" font-size="10" font-weight="700" fill="#23201C">Ven. 4 · entraînement</text>
  <rect x="52" y="450" width="244" height="14" rx="4" fill="#FFFCF7" stroke="#E7DECF"/>
  <text x="82" y="460" font-size="8" fill="#5B564F">Oui</text>
  <text x="160" y="460" font-size="8" fill="#5B564F">Peut-être</text>
  <text x="252" y="460" font-size="8" fill="#5B564F">Non</text>

  <!-- block 3 -->
  <text x="44" y="496" font-size="10.5" font-weight="700" fill="#5B564F">LES 14 PROCHAINS JOURS</text>
  <line x1="200" y1="492" x2="304" y2="492" stroke="#1E5F74" stroke-width="2" opacity="0.2"/>
  <rect x="44" y="504" width="260" height="34" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
  <text x="56" y="524" font-size="9.5" fill="#5B564F">Mer. 9 · entraînement · réponse : Oui</text>
  <rect x="44" y="544" width="260" height="34" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
  <text x="56" y="558" font-size="9.5" fill="#23201C">Sam. 12 · Extérieur · vs Orvault</text>
  <text x="56" y="572" font-size="9" fill="#AA4F22">Convocations pas encore envoyées</text>

  <!-- block 4 -->
  <text x="44" y="604" font-size="10.5" font-weight="700" fill="#5B564F">APRÈS LE MATCH</text>
  <line x1="146" y1="600" x2="304" y2="600" stroke="#1E5F74" stroke-width="2" opacity="0.2"/>
  <rect x="44" y="612" width="260" height="60" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
  <text x="56" y="630" font-size="9" fill="#5B564F">Sam. 29 août · vs Vertou</text>
  <text x="56" y="650" font-size="16" font-weight="800" fill="#23201C" font-family="'Big Shoulders Display', 'Arial Narrow', sans-serif">62 – 58</text>
  <rect x="120" y="638" width="52" height="15" rx="7" fill="#2F7D5C"/>
  <text x="128" y="649" font-size="8" fill="#FAF5EF">Victoire</text>
  <text x="56" y="666" font-size="9" fill="#5B564F">Vos stats : 11 pts · Votes ouverts (1 j)</text>

  <!-- tab bar -->
  <rect x="24" y="676" width="300" height="30" fill="#FFFCF7" stroke="#E7DECF"/>
  <rect x="24" y="676" width="75" height="30" fill="#FBEDE4"/>
  <rect x="24" y="676" width="75" height="2" fill="#D4622A"/>
  <text x="34" y="695" font-size="8.5" font-weight="700" fill="#AA4F22">Ma semaine</text>
  <text x="112" y="695" font-size="8.5" font-weight="700" fill="#5B564F">Mon équipe</text>
  <text x="196" y="695" font-size="8.5" font-weight="700" fill="#5B564F">Résultats</text>
  <text x="272" y="695" font-size="8.5" font-weight="700" fill="#5B564F">Profil</text>

  <!-- callouts column -->
  <g font-size="12">
    <rect x="352" y="86" width="624" height="98" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
    <text x="368" y="110" font-size="13" font-weight="700" fill="#1E5F74">1 · Prochain rendez-vous — « où je vais maintenant »</text>
    <text x="368" y="132" fill="#23201C">Le premier événement à venir, tous types confondus. Porte l’adresse et un lien d’itinéraire, l’état de sa</text>
    <text x="368" y="150" fill="#23201C">propre réponse, l’assignation de matériel et un résumé de présences.</text>
    <text x="368" y="172" fill="#5B564F">Donnée : GET /me/dashboard (from = maintenant) + rsvpSummary et logistics à ajouter à MyAgendaEvent.</text>

    <rect x="352" y="196" width="624" height="98" rx="6" fill="#FAF5EF" stroke="#D4622A" stroke-opacity="0.45"/>
    <text x="368" y="220" font-size="13" font-weight="700" fill="#AA4F22">2 · À répondre — le seul bloc qui peut être vide, et c’est une bonne nouvelle</text>
    <text x="368" y="242" fill="#23201C">Les événements à venir sans réponse, convocation d’abord. Chaque carte porte le contrôle tri-état :</text>
    <text x="368" y="260" fill="#23201C">répondre ne demande plus de naviguer. Le bloc disparaît quand tout est répondu.</text>
    <text x="368" y="282" fill="#5B564F">Donnée : filtre client sur myRsvpStatus === null — déjà servi aujourd’hui (my-dashboard.ts:17).</text>

    <rect x="352" y="306" width="624" height="98" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
    <text x="368" y="330" font-size="13" font-weight="700" fill="#1E5F74">3 · Les 14 prochains jours — « qu’est-ce qui arrive »</text>
    <text x="368" y="352" fill="#23201C">Agenda groupé par jour sur deux semaines, pas une. Un match du samedi suivant est invisible dans la</text>
    <text x="368" y="370" fill="#23201C">fenêtre de 7 jours actuelle dès qu’on regarde en milieu de semaine — le cas le plus courant.</text>
    <text x="368" y="392" fill="#5B564F">Donnée : GET /me/dashboard?from&amp;to — les paramètres existent déjà, aucun changement serveur.</text>

    <rect x="352" y="416" width="624" height="98" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
    <text x="368" y="440" font-size="13" font-weight="700" fill="#1E5F74">4 · Après le match — la moitié de la boucle qui n’existe pas</text>
    <text x="368" y="462" fill="#23201C">Résultat, stats personnelles du match, fenêtre de vote MVP. Aujourd’hui aucun écran ne montre un</text>
    <text x="368" y="480" fill="#23201C">événement passé au joueur hors de l’onglet « Passés » d’une page équipe.</text>
    <text x="368" y="502" fill="#5B564F">Donnée : fenêtre inversée sur le même endpoint + un champ result et l’état du vote (nouveaux).</text>

    <rect x="352" y="526" width="624" height="180" rx="6" fill="#EAF1F3" stroke="#1E5F74" stroke-dasharray="4 3"/>
    <text x="368" y="550" font-size="13" font-weight="700" fill="#1E5F74">Ce qui disparaît de l’accueil du joueur</text>
    <text x="368" y="574" fill="#23201C">· Les tuiles de compteurs (DashboardPage.tsx:180-192) : deux nombres, aucune action possible dessus.</text>
    <text x="368" y="594" fill="#23201C">· La grille de cartes « Mes équipes » (DashboardPage.tsx:221-242), doublon exact de MyTeamsPage, désormais</text>
    <text x="368" y="612" fill="#23201C">  un onglet permanent de la barre basse.</text>
    <text x="368" y="632" fill="#23201C">· L’adresse e-mail sous le prénom (DashboardPage.tsx:147-151) — de la donnée de compte, pas de la semaine.</text>
    <text x="368" y="656" font-size="12" font-weight="700" fill="#1E5F74">Ce qui reste, à l’identique, côté manager</text>
    <text x="368" y="678" fill="#23201C">Les quatre tuiles, les cartes d’équipe et « Cette semaine » sont conservées dans la variante admin/coach ;</text>
    <text x="368" y="696" fill="#23201C">elles descendent simplement sous une bande « à traiter ». Voir mockups/admin-home.html.</text>
  </g>

  <g>
    <rect x="24" y="722" width="952" height="76" rx="6" fill="#FAF5EF" stroke="#E7DECF"/>
    <text x="40" y="746" font-size="12.5" font-weight="700" fill="#23201C">Contrainte de conception</text>
    <text x="40" y="768" font-size="12" fill="#23201C">Tous les blocs se composent de primitives existantes (Card, Badge, Text, SectionHeading, EventRsvpControl). Le seul</text>
    <text x="40" y="786" font-size="12" fill="#23201C">jeton manquant est nav-active-top, pour le filet orange en haut d’un onglet de barre basse — à ajouter au preset.</text>
  </g>
</svg>
