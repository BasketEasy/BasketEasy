<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="1000" height="460" fill="#FAF5EF"/>

  <text x="24" y="30" font-size="14" font-weight="700" fill="#6B645A">CURRENT — empty "Joueurs" tab</text>
  <rect x="24" y="42" width="460" height="180" rx="6" fill="#FFFFFF" stroke="#E4DACD"/>
  <rect x="24" y="42" width="460" height="30" fill="#F1E9DD"/>
  <text x="36" y="62" font-size="10" fill="#6B645A">JOUEUR</text><text x="230" y="62" font-size="10" fill="#6B645A">CLUB</text><text x="380" y="62" font-size="10" fill="#6B645A">ACTION</text>
  <text x="230" y="200" font-size="11" fill="#8A8377" text-anchor="middle">Aucun résultat</text>

  <text x="524" y="30" font-size="14" font-weight="700" fill="#1E5F74">PROPOSED — actionable empty state</text>
  <rect x="524" y="42" width="452" height="180" rx="8" fill="#FFFFFF" stroke="#E4DACD" stroke-dasharray="4 3"/>
  <circle cx="750" cy="100" r="26" fill="#F1E9DD"/>
  <text x="738" y="108" font-size="20" fill="#D4622A">👤</text>
  <text x="750" y="150" font-size="13" font-weight="600" fill="#23201C" text-anchor="middle">Aucun joueur pour l'instant</text>
  <text x="750" y="170" font-size="11" fill="#6B645A" text-anchor="middle">Ajoutez votre premier joueur pour commencer</text>
  <rect x="680" y="182" width="140" height="28" rx="6" fill="#D4622A"/>
  <text x="700" y="200" font-size="11" fill="#FFFFFF">+ Ajouter un joueur</text>

  <rect x="24" y="250" width="952" height="180" rx="6" fill="#EAF1EE" stroke="#1E5F74" stroke-dasharray="4 3"/>
  <text x="40" y="276" font-size="13" font-weight="700" fill="#1E5F74">Why this matters</text>
  <text x="40" y="300" font-size="12" fill="#23201C">7+ list views (Membres/Joueurs/Équipes tabs on MembersPage; Clubs partenaires/Effectif/Événements/</text>
  <text x="40" y="320" font-size="12" fill="#23201C">Administrateurs sections on TeamDetailPage) currently fall back to Pagination's terse "Aucun résultat" caption</text>
  <text x="40" y="340" font-size="12" fill="#23201C">when empty — easy to miss, and gives a brand-new club admin (BasketEasy's actual early-adopter persona:</text>
  <text x="40" y="360" font-size="12" fill="#23201C">a volunteer setting up their club for the first time) no next action. A shared EmptyState component</text>
  <text x="40" y="380" font-size="12" fill="#23201C">(icon + message + primary CTA, reusing existing Button/Card from @basketeasy/ui) dropped into each table's</text>
  <text x="40" y="400" font-size="12" fill="#23201C">"no rows" branch turns 7 dead ends into 7 onboarding prompts, at low implementation cost.</text>
</svg>
