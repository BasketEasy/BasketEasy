<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <rect width="1000" height="620" fill="#FAF5EF"/>

  <!-- CURRENT -->
  <text x="24" y="30" font-size="14" font-weight="700" fill="#6B645A">CURRENT — AppHeader.tsx (admin of 4 clubs)</text>
  <rect x="24" y="42" width="952" height="64" fill="#FFFFFF" stroke="#E4DACD"/>
  <text x="36" y="78" font-size="18" font-weight="800" fill="#D4622A" font-family="Georgia, serif">BasketEasy</text>
  <g font-size="10" fill="#23201C">
    <text x="230" y="66">Tableau de bord</text><text x="330" y="66">Mes équipes</text><text x="410" y="66">Mon profil</text><text x="475" y="66">Créer un club</text>
    <text x="560" y="60" fill="#8A8377">AS NANTES</text><text x="560" y="78">Effectif</text>
    <text x="630" y="60" fill="#8A8377">ES REZÉ</text><text x="630" y="78">Effectif</text>
    <text x="700" y="60" fill="#8A8377">USSA</text><text x="700" y="78">Effectif</text>
    <text x="760" y="60" fill="#8A8377">CTC LOIRE</text><text x="760" y="78">Effectif</text>
  </g>
  <rect x="24" y="116" width="952" height="70" rx="6" fill="#FBEEE6" stroke="#D4622A" stroke-dasharray="4 3"/>
  <text x="36" y="138" font-size="12" fill="#B23B3B">Every admin club adds its own label+button pair, inline, unbounded — a real CD44 admin of 8+ clubs</text>
  <text x="36" y="158" font-size="12" fill="#B23B3B">would see the header wrap across several lines before reaching "Mon profil" on desktop, and the mobile</text>
  <text x="36" y="176" font-size="12" fill="#B23B3B">burger menu becomes a long undifferentiated scroll of club names and identical "Effectif" buttons.</text>

  <!-- PROPOSED -->
  <text x="24" y="230" font-size="14" font-weight="700" fill="#1E5F74">PROPOSED — club switcher dropdown</text>
  <rect x="24" y="242" width="952" height="64" fill="#FFFFFF" stroke="#E4DACD"/>
  <text x="36" y="278" font-size="18" font-weight="800" fill="#D4622A" font-family="Georgia, serif">BasketEasy</text>
  <rect x="220" y="258" width="200" height="30" rx="15" fill="#F1E9DD" stroke="#E4DACD"/>
  <text x="236" y="278" font-size="12" fill="#23201C">AS Basket Nantes ▾</text>
  <g font-size="11" fill="#23201C">
    <text x="460" y="266">Tableau de bord</text><text x="565" y="266">Mes équipes</text><text x="650" y="266" font-weight="700" fill="#D4622A">Effectif</text><text x="720" y="266">Mon profil</text>
  </g>
  <circle cx="940" cy="272" r="16" fill="#1E5F74"/><text x="934" y="277" font-size="11" fill="#FFF">JC</text>
  <rect x="638" y="252" width="76" height="26" rx="6" fill="none" stroke="#D4622A" stroke-dasharray="2 2"/>
  <text x="638" y="248" font-size="9" fill="#D4622A">persistent link, not a switcher option</text>

  <!-- open dropdown state -->
  <rect x="220" y="288" width="260" height="180" rx="8" fill="#FFFFFF" stroke="#E4DACD" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.12))"/>
  <text x="234" y="308" font-size="10" fill="#8A8377">VOS CLUBS (ADMIN) — clic = changer le contexte</text>
  <rect x="222" y="316" width="256" height="34" fill="#FBEEE6"/>
  <text x="234" y="337" font-size="12" fill="#D4622A" font-weight="600">&#10003; AS Basket Nantes</text>
  <text x="234" y="373" font-size="12" fill="#23201C">ES Rezé</text>
  <text x="234" y="409" font-size="12" fill="#23201C">USSA</text>
  <line x1="222" y1="424" x2="478" y2="424" stroke="#F1E9DD"/>
  <text x="234" y="444" font-size="11" fill="#1E5F74">+ Créer un club</text>
  <text x="234" y="464" font-size="11" fill="#1E5F74">Gérer mes clubs &#8594;</text>

  <rect x="24" y="496" width="952" height="115" rx="6" fill="#EAF1EE" stroke="#1E5F74" stroke-dasharray="4 3"/>
  <text x="36" y="516" font-size="12" fill="#23201C">Two separate controls, not one overloaded one: (1) the chip is a pure open/close toggle — clicking anywhere</text>
  <text x="36" y="536" font-size="12" fill="#23201C">on it opens the panel, nothing navigates; (2) clicking a club row only sets the active context (checkmark</text>
  <text x="36" y="556" font-size="12" fill="#23201C">moves, panel closes) — it does not navigate either. Reaching a club's roster is a separate, persistent</text>
  <text x="36" y="576" font-size="12" fill="#23201C">"Effectif" nav item (highlighted above) that always targets the currently active club — O(1) header size</text>
  <text x="36" y="596" font-size="12" fill="#23201C">regardless of admin-club count. Zero-admin-club users: no switcher renders at all (mirrors today's</text>
  <text x="36" y="609" font-size="10" fill="#6B645A">AppHeader.tsx `adminClubs.length > 0` guard) — "Créer un club" stays a normal top-level link either way.</text>
</svg>
