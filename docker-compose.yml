services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-basketeasy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-basketeasy}
      POSTGRES_DB: ${POSTGRES_DB:-basketeasy}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-basketeasy}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-basketeasy}:${POSTGRES_PASSWORD:-basketeasy}@postgres:5432/${POSTGRES_DB:-basketeasy}
      # Neon (prod) needs a separate unpooled connection for migrations; the
      # local postgres container has no pooling, so the two are just the same.
      NEON_DIRECT_URL: postgresql://${POSTGRES_USER:-basketeasy}:${POSTGRES_PASSWORD:-basketeasy}@postgres:5432/${POSTGRES_DB:-basketeasy}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-secret-change-me-please-use-something-random}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      # Scoresheet OCR (Gemini vision) — like the R2_* vars above, unset
      # only fails an actual OCR job, not server boot.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Every e-mailed and pushed deep link is built from this: the app
      # stores notification links as frontend-relative paths and prefixes
      # them at send time. Without it, links in e-mail point at localhost.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Brevo transactional e-mail. Empty binds the logging mail client, so
      # verification/reset links land in the server log instead of an inbox —
      # which is how these flows are exercised locally.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@kluvo.fr}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Kluvo}
      # Web Push. Empty disables push; the frontend then hides its toggle.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:no-reply@kluvo.fr}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres_data:
