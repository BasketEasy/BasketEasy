name: Apply Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'server/prisma/**' # Only run if database schema or migrations change
  workflow_dispatch: {} # Allow running manually from the Actions tab

env:
  PNPM_VERSION: 9.7.0
  NODE_VERSION: 24

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DIRECT_URL: ${{ secrets.NEON_DIRECT_URL }}
        run: pnpm --filter @basketeasy/server run prisma:migrate:deploy
